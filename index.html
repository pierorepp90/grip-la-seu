<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grip La Seu — Ressolats de peus de gat</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/app.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body x-data="site()">
  <header class="site-header">
    <div class="container">
      <div class="logo">
        <img src="assets/logo.svg" alt="Grip La Seu" />
      </div>
      <button class="menu-toggle" @click="menuOpen = !menuOpen" aria-label="Menú">&#9776;</button>
      <div class="header-controls" :class="{ open: menuOpen }">
        <div class="lang-switch" role="group" aria-label="Idioma">
          <template x-for="lang in langs" :key="lang">
            <button @click="setLang(lang)" :aria-current="lang === $store.i18n.lang" x-text="lang.toUpperCase()"></button>
          </template>
        </div>
        <div class="social-links">
          <a href="https://wa.me/34669918744" target="_blank" rel="noopener" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413" />
            </svg>
          </a>
          <a href="https://instagram.com/griplaseu" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.72 3.72 0 0 1-1.38-.9 3.72 3.72 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.3-1.46.72-2.13 1.38C1.35 2.68.93 3.35.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.3.79.72 1.46 1.38 2.13.67.66 1.34 1.08 2.13 1.38.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.3 1.46-.72 2.13-1.38.66-.67 1.08-1.34 1.38-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91a5.88 5.88 0 0 0-1.38-2.13A5.88 5.88 0 0 0 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zM12 16a4 4 0 1 1 4-4 4 4 0 0 1-4 4zm6.41-11.84a1.44 1.44 0 1 0 1.44 1.44 1.44 1.44 0 0 0-1.44-1.44z" />
            </svg>
          </a>
          <a href="mailto:hola@griplaseu.com" aria-label="Email">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2" fill="currentColor" />
              <path d="M3 5.5 12 12l9-6.5" fill="none" stroke="var(--color-navy)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
        </div>
        <button class="btn btn-primary" @click="modalOpen = true" x-text="$t('nav_cta')"></button>
      </div>
    </div>
  </header>

  <!-- Order form modal (Task 17) -->
  <div class="modal-overlay" x-show="modalOpen" x-cloak @keydown.escape.window="modalOpen = false" style="display: none;">
    <div class="modal" x-data="orderForm()" @click.outside="modalOpen = false" role="dialog" aria-modal="true">
      <button class="modal-close" @click="modalOpen = false" aria-label="Tancar">&times;</button>
        <div class="step-indicator">
          <span :class="{ active: step >= 1 }"></span>
          <span :class="{ active: step >= 2 }"></span>
          <span :class="{ active: step >= 3 }"></span>
        </div>

        <template x-if="success">
          <div>
            <h2 x-text="$t('gracias_title')"></h2>
            <p x-text="$t('gracias_paid')"></p>
            <p><strong x-text="orderId"></strong></p>
            <ul class="point-list">
              <template x-for="linea in summaryLines" :key="linea">
                <li x-text="linea"></li>
              </template>
            </ul>
          </div>
        </template>

        <template x-if="!success && step === 1">
          <div>
            <h2 x-text="$t('step1_title')"></h2>

            <label x-text="$t('tipo_calzado_label')"></label>
            <div class="toggle-group">
              <button type="button" class="toggle-option" :class="{ selected: tipoCalzado === 'pie_de_gato' }" @click="tipoCalzado = 'pie_de_gato'" x-text="$t('tipo_pie_de_gato')"></button>
              <button type="button" class="toggle-option" :class="{ selected: tipoCalzado === 'bota' }" @click="tipoCalzado = 'bota'" x-text="$t('tipo_bota')"></button>
            </div>

            <div class="service-item">
              <div class="service-item-header">
                <strong x-text="$t('service_resolado_completo_title')"></strong>
              </div>
              <div class="service-item-selects">
                <select x-model="resoladoMaterial" :aria-label="$t('material_label')">
                  <option value="vibram_xs_grip2" x-text="$t('material_vibram_xs_grip2')"></option>
                  <option value="vibram_xs_grip_edge" x-text="$t('material_vibram_xs_grip_edge')"></option>
                </select>
              </div>
              <div class="service-item-footer">
                <span x-text="precioResolado.toFixed(2) + '€/ud'"></span>
                <button type="button" class="btn btn-secondary" @click="anadirResolado()" x-text="$t('btn_anadir')"></button>
              </div>
            </div>

            <div class="service-item">
              <div class="service-item-header">
                <strong x-text="$t('service_media_suela_title')"></strong>
              </div>
              <div class="service-item-selects">
                <select x-model="mediaSuelaMaterial" :aria-label="$t('material_label')">
                  <option value="vibram_xs_grip2" x-text="$t('material_vibram_xs_grip2')"></option>
                  <option value="vibram_xs_grip_edge" x-text="$t('material_vibram_xs_grip_edge')"></option>
                </select>
              </div>
              <div class="service-item-footer">
                <span x-text="precioMediaSuela.toFixed(2) + '€/ud'"></span>
                <button type="button" class="btn btn-secondary" @click="anadirMediaSuela()" x-text="$t('btn_anadir')"></button>
              </div>
            </div>

            <div class="service-item">
              <div class="service-item-footer">
                <span x-text="$t('service_puntera_title') + ' · ' + precioPuntera.toFixed(2) + '€/ud'"></span>
                <div class="stepper-inline">
                  <button type="button" @click="decrementarPuntera()" aria-label="−">−</button>
                  <span x-text="cantidadPuntera"></span>
                  <button type="button" @click="incrementarPuntera()" aria-label="+">+</button>
                </div>
              </div>
            </div>

            <template x-if="carrito.length > 0">
              <div class="cart-summary">
                <p class="cart-summary-title" x-text="$t('carrito_title')"></p>
                <template x-for="linea in carrito" :key="linea.tipoCalzado + linea.servicio + linea.material">
                  <div class="cart-line">
                    <span class="cart-line-info">
                      <span x-text="$t('tipo_' + linea.tipoCalzado) + ' · ' + $t('service_' + linea.servicio + '_title')"></span>
                      <span class="cart-line-variant" x-show="linea.material" x-text="linea.material ? $t('material_' + linea.material) : ''"></span>
                    </span>
                    <span class="cart-line-controls">
                      <button type="button" @click="ajustarCantidad(linea, -1)" aria-label="−">−</button>
                      <span x-text="linea.cantidad"></span>
                      <button type="button" @click="ajustarCantidad(linea, 1)" aria-label="+">+</button>
                      <strong x-text="linea.precioSubtotal.toFixed(2) + '€'"></strong>
                      <button type="button" class="cart-line-remove" @click="quitarDelCarrito(linea)" aria-label="Quitar">✕</button>
                    </span>
                  </div>
                </template>
              </div>
            </template>

            <p class="price-total" x-show="carrito.length > 0" x-text="$t('precio_total_label') + ': ' + totalCarrito.toFixed(2) + '€'"></p>

            <div class="modal-nav">
              <span></span>
              <button type="button" class="btn btn-primary" :disabled="!canProceedStep1" @click="step = 2" x-text="$t('btn_siguiente')"></button>
            </div>
          </div>
        </template>

        <template x-if="!success && step === 2">
          <div>
            <h2 x-text="$t('step2_title')"></h2>

            <div class="form-field">
              <label for="of-nombre" x-text="$t('nombre_label')"></label>
              <input id="of-nombre" type="text" x-model="nombre" />
            </div>
            <div class="form-field">
              <label for="of-direccion" x-text="$t('direccion_label')"></label>
              <input id="of-direccion" type="text" x-model="direccion" @blur="buscarPuntosGLS()" />
            </div>
            <div class="form-field">
              <label for="of-telefono" x-text="$t('telefono_label')"></label>
              <input id="of-telefono" type="tel" x-model="telefono" />
            </div>
            <div class="form-field">
              <label for="of-email" x-text="$t('email_label')"></label>
              <input id="of-email" type="email" x-model="email" />
            </div>

            <label x-text="$t('entrega_label')"></label>

            <div class="delivery-option-card" :class="{ selected: entregaTipo === 'gls' }" tabindex="0" role="button" :aria-pressed="entregaTipo === 'gls'" @click="if (entregaTipo !== 'gls') { entregaTipo = 'gls'; entregaNombre = ''; metodoPago = ''; }" @keydown.enter.self="if (entregaTipo !== 'gls') { entregaTipo = 'gls'; entregaNombre = ''; metodoPago = ''; }" @keydown.space.prevent.self="if (entregaTipo !== 'gls') { entregaTipo = 'gls'; entregaNombre = ''; metodoPago = ''; }">
              <strong x-text="$t('entrega_gls')"></strong>
              <template x-if="entregaTipo === 'gls'">
                <div>
                  <p x-show="geocodeError" class="error-message" x-text="$t('puntos_geocode_error')"></p>
                  <p x-text="$t('puntos_cercanos_title')"></p>
                  <ul class="point-list">
                    <template x-for="punto in puntosCercanos" :key="punto.nombre">
                      <li>
                        <label @click.stop>
                          <input type="radio" name="punto-gls" :value="punto.nombre" x-model="entregaNombre" />
                          <span x-text="punto.nombre + (punto.distanceKm ? ' (' + punto.distanceKm.toFixed(1) + ' km)' : '')"></span>
                        </label>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>

            <div class="delivery-option-card" :class="{ selected: entregaTipo === 'tienda' }" tabindex="0" role="button" :aria-pressed="entregaTipo === 'tienda'" @click="if (entregaTipo !== 'tienda') { entregaTipo = 'tienda'; entregaNombre = ''; metodoPago = ''; }" @keydown.enter.self="if (entregaTipo !== 'tienda') { entregaTipo = 'tienda'; entregaNombre = ''; metodoPago = ''; }" @keydown.space.prevent.self="if (entregaTipo !== 'tienda') { entregaTipo = 'tienda'; entregaNombre = ''; metodoPago = ''; }">
              <strong x-text="$t('entrega_tienda')"></strong>
              <template x-if="entregaTipo === 'tienda'">
                <ul class="point-list">
                  <template x-for="tienda in tiendas" :key="tienda.nombre">
                    <li>
                      <label @click.stop>
                        <input type="radio" name="tienda" :value="tienda.nombre" x-model="entregaNombre" />
                        <span x-text="tienda.nombre + ' — ' + tienda.direccion"></span>
                      </label>
                    </li>
                  </template>
                </ul>
              </template>
            </div>

            <p class="price-total" x-show="entregaTipo" x-text="incluyeTransporte ? ($t('precio_total_label') + ': ' + precioTotal.toFixed(2) + '€ (' + $t('envio_gls_label') + ': ' + transporteGLS.toFixed(2) + '€)') : ($t('precio_total_label') + ': ' + precioTotal.toFixed(2) + '€')"></p>

            <div class="modal-nav">
              <button type="button" class="btn btn-secondary" @click="step = 1" x-text="$t('btn_atras')"></button>
              <button type="button" class="btn btn-primary" :disabled="!canProceedStep2" @click="step = 3" x-text="$t('btn_siguiente')"></button>
            </div>
          </div>
        </template>

        <template x-if="!success && step === 3">
          <div>
            <h2 x-text="$t('step3_title')"></h2>

            <label x-text="$t('pago_label')"></label>
            <div class="toggle-group">
              <button type="button" class="toggle-option" :class="{ selected: metodoPago === 'bizum' }" @click="metodoPago = 'bizum'" x-text="$t('pago_bizum')"></button>
              <button type="button" class="toggle-option" :class="{ selected: metodoPago === 'transferencia' }" @click="metodoPago = 'transferencia'" x-text="$t('pago_transferencia')"></button>
              <button type="button" class="toggle-option" :class="{ selected: metodoPago === 'tarjeta' }" @click="metodoPago = 'tarjeta'" x-text="$t('pago_tarjeta')"></button>
              <button type="button" class="toggle-option" :class="{ selected: metodoPago === 'efectivo' }" :disabled="entregaTipo !== 'tienda'" @click="metodoPago = 'efectivo'" x-text="$t('pago_efectivo')"></button>
            </div>
            <p class="error-message" x-show="entregaTipo !== 'tienda'" x-text="$t('pago_efectivo_solo_tienda')"></p>

            <template x-if="metodoPago === 'bizum'">
              <p x-text="$t('pago_bizum_instrucciones')"></p>
            </template>
            <template x-if="metodoPago === 'transferencia'">
              <p x-text="$t('pago_transferencia_instrucciones')"></p>
            </template>

            <p class="error-message" x-show="errorMsg" x-text="errorMsg"></p>

            <div class="modal-nav">
              <button type="button" class="btn btn-secondary" @click="step = 2" x-text="$t('btn_atras')"></button>
              <button type="button" class="btn btn-primary" x-show="metodoPago === 'tarjeta'" :disabled="submitting" @click="pagarConTarjeta()" x-text="$t('btn_pagar_tarjeta')"></button>
              <button type="button" class="btn btn-primary" x-show="metodoPago === 'bizum' || metodoPago === 'transferencia'" :disabled="submitting" @click="confirmarPedido()" x-text="$t('btn_ya_envie')"></button>
              <button type="button" class="btn btn-primary" x-show="metodoPago === 'efectivo'" :disabled="submitting" @click="confirmarPedido()" x-text="$t('btn_confirmar_pedido')"></button>
            </div>
          </div>
        </template>
    </div>
  </div>

  <section class="hero">
    <div class="container">
      <img class="hero-logo" src="assets/logo-hero.png" alt="Grip La Seu" />
      <h1 x-text="$t('hero_title')"></h1>
      <p x-text="$t('hero_subtitle')"></p>
      <div class="hero-ctas">
        <button class="btn btn-primary hero-cta-primary" @click="modalOpen = true" x-text="$t('hero_cta_primary')"></button>
        <a class="btn btn-secondary" href="#services" x-text="$t('hero_cta_secondary')"></a>
      </div>
    </div>
  </section>

  <section class="services" id="services">
    <div class="container">
      <h2 x-text="$t('services_title')"></h2>
      <div class="service-cards">
        <article class="service-card">
          <h3 x-text="$t('service_resolado_completo_title')"></h3>
          <p x-text="$t('service_resolado_completo_desc')"></p>
          <p class="price" x-text="$t('service_from') + ' ' + precioDesde('resolado_completo').toFixed(2) + '€'"></p>
        </article>
        <article class="service-card">
          <h3 x-text="$t('service_media_suela_title')"></h3>
          <p x-text="$t('service_media_suela_desc')"></p>
          <p class="price" x-text="$t('service_from') + ' ' + precioDesde('media_suela').toFixed(2) + '€'"></p>
        </article>
        <article class="service-card">
          <h3 x-text="$t('service_puntera_title')"></h3>
          <p x-text="$t('service_puntera_desc')"></p>
          <p class="price" x-text="$t('service_from') + ' ' + precioDesde('puntera').toFixed(2) + '€'"></p>
        </article>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p x-text="'Grip La Seu · ' + new Date().getFullYear() + ' · ' + $t('footer_rights')"></p>
    </div>
  </footer>
</body>
</html>
